<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Para Anna Lourdes ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a001f, #4b0b52, #17001a);
            color: white;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #ddd;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #ff4fa3;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.03);
            background: #ff2f91;
        }

        #erro {
            color: #ff8f8f;
            margin-top: 15px;
            display: none;
        }

        #mensagem {
            display: none;
        }

        .coracao {
            font-size: 55px;
            margin-bottom: 15px;
            animation: pulsar 1.5s infinite;
        }

        .texto {
            margin-top: 25px;
            line-height: 1.8;
            color: #f5f5f5;
            white-space: pre-line;
        }

        @keyframes pulsar {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- LOGIN -->
        <div class="card" id="login">

            <div class="coracao">❤️</div>

            <h1>Para Anna Lourdes</h1>

            <p class="subtitle">
                Tem uma coisinha aqui para você...
            </p>

            <input
                type="text"
                id="usuario"
                placeholder="Usuário"
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
            >

            <button onclick="entrar()">
                Entrar
            </button>

            <p id="erro">
                Usuário ou senha incorretos.
            </p>

        </div>


        <!-- MENSAGEM -->
        <div class="card" id="mensagem">

            <div class="coracao">❤️</div>

            <h1>Oi, Lourdinha</h1>

            <div class="texto">
                Amo Voce muitoooooooooooooooooooooooooooooo
                ❤️
            </div>

        </div>

    </div>


    <script>

        function entrar() {

            const usuario = document.getElementById("usuario").value;
            const senha = document.getElementById("senha").value;

            if (usuario === "Lourdinha" && senha === "04/05") {

                document.getElementById("login").style.display = "none";

                document.getElementById("mensagem").style.display = "block";

            } else {

                document.getElementById("erro").style.display = "block";

            }
        }

    </script>

</body>
</html>
